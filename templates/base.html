<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}学生管理系统{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root {
            --sb-w: 236px;
            --sb-w-min: 66px;
        }

        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body {
            overflow: hidden;
            color: #1f2937;
            background: #eef1f6;
            font-family: "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, "Segoe UI", sans-serif;
        }

        .layout { display: flex; height: 100vh; overflow: hidden; }

        /* ============ 左侧菜单 ============ */
        .sidebar {
            position: relative;
            z-index: 20;
            flex: 0 0 auto;
            width: var(--sb-w);
            display: flex;
            flex-direction: column;
            background: linear-gradient(180deg, #0f172a 0%, #111c33 100%);
            box-shadow: 2px 0 12px rgba(15, 23, 42, .18);
            transition: width .22s ease;
        }
        .layout.collapsed .sidebar { width: var(--sb-w-min); }

        .brand {
            height: 58px;
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 18px;
            overflow: hidden;
            white-space: nowrap;
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            background: rgba(255, 255, 255, .04);
            border-bottom: 1px solid rgba(255, 255, 255, .06);
        }
        .brand i { flex: 0 0 auto; font-size: 20px; color: #818cf8; }
        .layout.collapsed .brand { justify-content: center; padding: 0; }
        .layout.collapsed .brand span { display: none; }

        .menu { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 10px 0; }
        .menu::-webkit-scrollbar { width: 6px; }
        .menu::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, .12); border-radius: 3px; }

        .menu-title {
            padding: 12px 20px 6px;
            font-size: 11px;
            letter-spacing: 1px;
            color: #64748b;
            white-space: nowrap;
        }
        .layout.collapsed .menu-title { padding: 12px 0 6px; text-align: center; font-size: 0; }
        .layout.collapsed .menu-title::after { content: "···"; font-size: 11px; }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            height: 44px;
            padding: 0 20px;
            font-size: 13.5px;
            color: #c3ceda;
            text-decoration: none;
            white-space: nowrap;
            border-left: 3px solid transparent;
            transition: background .15s, color .15s;
        }
        .menu-item i { flex: 0 0 20px; font-size: 16px; text-align: center; }
        .menu-item:hover { color: #fff; background: rgba(255, 255, 255, .06); }
        .menu-item.active {
            color: #fff;
            border-left-color: #6366f1;
            background: linear-gradient(90deg, rgba(99, 102, 241, .35), rgba(99, 102, 241, .04));
        }
        .layout.collapsed .menu-item { justify-content: center; padding: 0; }
        .layout.collapsed .menu-item span { display: none; }

        .sidebar-foot {
            flex: 0 0 auto;
            padding: 12px 18px;
            font-size: 11px;
            color: #475569;
            white-space: nowrap;
            border-top: 1px solid rgba(255, 255, 255, .06);
        }
        .layout.collapsed .sidebar-foot { display: none; }

        /* ============ 右侧主区域 ============ */
        .main { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100vh; }

        .topbar {
            flex: 0 0 auto;
            height: 58px;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 0 18px;
            background: #fff;
            border-bottom: 1px solid #e5e7eb;
            box-shadow: 0 1px 4px rgba(15, 23, 42, .04);
        }
        .icon-btn {
            width: 34px;
            height: 34px;
            display: grid;
            place-items: center;
            border: 0;
            border-radius: 8px;
            font-size: 17px;
            color: #475569;
            background: #f1f5f9;
        }
        .icon-btn:hover { background: #e2e8f0; }
        .page-title { font-size: 15px; font-weight: 600; color: #1f2937; }

        .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 16px; }
        .user-chip { display: flex; align-items: center; gap: 9px; }
        .avatar {
            width: 34px;
            height: 34px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, #6366f1, #06b6d4);
        }
        .user-name { font-size: 13px; font-weight: 600; color: #1f2937; line-height: 1.2; }
        .user-role { font-size: 11px; color: #94a3b8; }

        .logout-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            height: 34px;
            padding: 0 14px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            font-size: 13px;
            color: #475569;
            text-decoration: none;
            transition: .15s;
        }
        .logout-btn:hover { color: #dc2626; background: #fef2f2; border-color: #fecaca; }

        /* ============ 标签页 ============ */
        .tabs {
            flex: 0 0 auto;
            height: 42px;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 0 12px;
            overflow-x: auto;
            overflow-y: hidden;
            background: #fff;
            border-bottom: 1px solid #e5e7eb;
        }
        .tabs::-webkit-scrollbar { height: 5px; }
        .tabs::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }

        .tab {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            height: 28px;
            padding: 0 10px;
            border: 1px solid transparent;
            border-radius: 7px;
            font-size: 12.5px;
            color: #475569;
            background: #f1f5f9;
            white-space: nowrap;
            cursor: pointer;
            user-select: none;
        }
        .tab:hover { background: #e2e8f0; }
        .tab.active { color: #4338ca; background: #eef2ff; border-color: #c7d2fe; font-weight: 600; }
        .tab-close {
            width: 14px;
            height: 14px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            font-size: 11px;
            opacity: .6;
        }
        .tab-close:hover { opacity: 1; background: rgba(0, 0, 0, .08); }

        /* ============ iframe 内容区 ============ */
        .content { flex: 1; min-height: 0; background: #eef1f6; }
        .content iframe { display: block; width: 100%; height: 100%; border: 0; background: #eef1f6; }

        /* ============ 小屏适配 ============ */
        @media (max-width: 768px) {
            .sidebar { position: fixed; top: 0; bottom: 0; left: 0; z-index: 50; }
            .main { margin-left: var(--sb-w); }
            .layout.collapsed .sidebar { transform: translateX(-100%); }
            .layout.collapsed .main { margin-left: 0; }
            .page-title, .user-meta { display: none; }
        }
    </style>
</head>
<body>
<div class="layout" id="layout">

    <!-- ============ 左侧侧边栏 ============ -->
    <aside class="sidebar">
        <div class="brand">
            <i class="bi bi-mortarboard-fill"></i>
            <span>学生管理系统</span>
        </div>

        <nav class="menu">
            <div class="menu-title">学习管理</div>
            <a class="menu-item active" href="{{ url_for('index') }}" data-title="个人档案">
                <i class="bi bi-person-badge"></i><span>个人档案</span>
            </a>
            <a class="menu-item" href="{{ url_for('schedule') }}" data-title="我的课表">
                <i class="bi bi-calendar3"></i><span>我的课表</span>
            </a>
            <a class="menu-item" href="{{ url_for('score') }}" data-title="我的成绩">
                <i class="bi bi-bar-chart-line"></i><span>我的成绩</span>
            </a>
            <a class="menu-item" href="{{ url_for('evaluation') }}" data-title="教学评价">
                <i class="bi bi-star"></i><span>教学评价</span>
            </a>
            <a class="menu-item" href="{{ url_for('selection') }}" data-title="在线选课">
                <i class="bi bi-journal-plus"></i><span>在线选课</span>
            </a>

            <div class="menu-title">事务办理</div>
            <a class="menu-item" href="{{ url_for('leave') }}" data-title="请假申请">
                <i class="bi bi-send-check"></i><span>请假申请</span>
            </a>
            <a class="menu-item" href="{{ url_for('notice') }}" data-title="校园公告">
                <i class="bi bi-megaphone"></i><span>校园公告</span>
            </a>
        </nav>

        <div class="sidebar-foot">v1.0 · Flask 学生管理系统</div>
    </aside>

    <!-- ============ 右侧主体 ============ -->
    <div class="main">

        <!-- 顶栏 -->
        <header class="topbar">
            <button class="icon-btn" id="collapseBtn" title="收起 / 展开菜单">
                <i class="bi bi-list"></i>
            </button>
            <div class="page-title" id="pageTitle">个人档案</div>

            <div class="topbar-right">
                <div class="user-chip">
                    <div class="avatar">{{ (session.get('name') or session.get('student_id') or 'U')[0] }}</div>
                    <div class="user-meta">
                        <div class="user-name">{{ session.get('name') or session.get('student_id') }}</div>
                        <div class="user-role">学号 {{ session.get('student_id') }}</div>
                    </div>
                </div>
                <a class="logout-btn" href="{{ url_for('logout') }}">
                    <i class="bi bi-box-arrow-right"></i> 安全退出
                </a>
            </div>
        </header>

        <!-- 标签页 -->
        <div class="tabs" id="tabs"></div>

        <!-- 内容区：iframe -->
        <div class="content">
            <iframe id="mainFrame" name="mainFrame" src="{{ url_for('index') }}" title="内容区"></iframe>
        </div>
    </div>
</div>

<script>
    (function () {
        var layout = document.getElementById('layout');
        var iframe = document.getElementById('mainFrame');
        var tabsEl = document.getElementById('tabs');
        var titleEl = document.getElementById('pageTitle');

        var homeUrl = "{{ url_for('index') }}";
        var homeTitle = "个人档案";

        /* 已打开的标签：{ url, title } */
        var tabs = [{ url: homeUrl, title: homeTitle }];
        var activeUrl = homeUrl;

        /* 渲染标签条 */
        function render() {
            tabsEl.innerHTML = '';
            tabs.forEach(function (t) {
                var el = document.createElement('div');
                el.className = 'tab' + (t.url === activeUrl ? ' active' : '');

                var name = document.createElement('span');
                name.className = 'tab-title';
                name.textContent = t.title;
                el.appendChild(name);

                /* 只剩一个标签时不显示关闭按钮 */
                if (tabs.length > 1) {
                    var close = document.createElement('i');
                    close.className = 'bi bi-x tab-close';
                    close.addEventListener('click', function (e) {
                        e.stopPropagation();
                        closeTab(t.url);
                    });
                    el.appendChild(close);
                }

                el.addEventListener('click', function () { activate(t.url); });
                tabsEl.appendChild(el);
            });
        }

        /* 激活指定标签 */
        function activate(url) {
            var tab = tabs.filter(function (t) { return t.url === url; })[0];
            if (!tab) return;
            activeUrl = url;
            if (iframe.getAttribute('src') !== url) {
                iframe.src = url;
            }
            titleEl.textContent = tab.title;
            document.querySelectorAll('.menu-item').forEach(function (a) {
                a.classList.toggle('active', a.getAttribute('href') === url);
            });
            render();
        }

        /* 打开（或切换）标签 */
        function openTab(url, title) {
            var exists = tabs.some(function (t) { return t.url === url; });
            if (!exists) tabs.push({ url: url, title: title });
            activate(url);
        }

        /* 关闭标签 */
        function closeTab(url) {
            var index = -1;
            tabs.forEach(function (t, i) { if (t.url === url) index = i; });
            if (index === -1) return;

            tabs.splice(index, 1);
            if (url === activeUrl) {
                var next = tabs[Math.min(index, tabs.length - 1)];
                if (next) {
                    activate(next.url);
                } else {
                    activeUrl = '';
                    iframe.src = 'about:blank';
                    titleEl.textContent = '工作台';
                    render();
                }
            } else {
                render();
            }
        }

        /* 菜单点击 -> 打开标签 */
        document.querySelectorAll('.menu-item').forEach(function (a) {
            a.addEventListener('click', function (e) {
                e.preventDefault();
                var url = a.getAttribute('href');
                var title = a.getAttribute('data-title') || a.textContent.trim();
                openTab(url, title);
            });
        });

        /* 侧边栏折叠（记忆到 localStorage） */
        if (localStorage.getItem('sidebar-collapsed') === '1') {
            layout.classList.add('collapsed');
        }
        document.getElementById('collapseBtn').addEventListener('click', function () {
            layout.classList.toggle('collapsed');
            localStorage.setItem('sidebar-collapsed', layout.classList.contains('collapsed') ? '1' : '0');
        });

        /* 初始化 */
        titleEl.textContent = homeTitle;
        render();
    })();
</script>
</body>
</html>
