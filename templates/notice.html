{% extends "layout.html" %}
{% block title %}公告 - 学生管理系统{% endblock %}

{% block content %}
<h4 class="mb-3">校园公告</h4>

<div class="list-group shadow-sm">
    {% for n in notices %}
    <div class="list-group-item py-3">
        <div class="d-flex justify-content-between align-items-center mb-1">
            <h6 class="mb-0">
                <a href="{{ url_for('notice_detail', id=n.id) }}" class="text-decoration-none">
                    {{ n.title }}
                </a>
            </h6>
            <small class="text-muted">{{ n.publish_date }}</small>
        </div>
        <p class="mb-0 small text-muted">{{ n.content|truncate(60) }}</p>
    </div>
    {% else %}
    <div class="list-group-item text-center text-muted py-4">暂无公告</div>
    {% endfor %}
</div>
{% endblock %}
