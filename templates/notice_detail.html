{% extends "layout.html" %}
{% block title %}{{ notice.title }} - 公告{% endblock %}

{% block content %}
<div class="card shadow-sm">
    <div class="card-body p-4">
        <h4 class="mb-2">{{ notice.title }}</h4>
        <p class="text-muted small mb-4">
            <i class="bi bi-calendar3 me-1"></i>发布日期：{{ notice.publish_date }}
        </p>
        <div class="notice-content">{{ notice.content }}</div>
    </div>
    <div class="card-footer bg-white py-3">
        <a href="{{ url_for('notice') }}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left me-1"></i>返回公告列表
        </a>
    </div>
</div>

<style>
    .notice-content {
        white-space: pre-wrap;
        line-height: 2;
        font-size: 14.5px;
        color: #374151;
    }
</style>
{% endblock %}
